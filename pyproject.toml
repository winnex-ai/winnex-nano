[build-system]
requires = ["scikit-build-core[pyproject]>=1.0", "pybind11>=2.12", "cmake>=3.20", "auditwheel>=5.0", "numpy>=1.20"]
build-backend = "scikit_build_core.build"

[project]
name = "winnex-nano"
# A versão vem da tag git, não de um literal. Um valor hardcoded já divergiu do
# pacote publicado (o __init__ dizia 0.1.12 num pacote 0.1.22), e essa classe
# de erro é silenciosa: o build passa e o wheel sobe com a versão errada.
dynamic = ["version"]
description = "Native Winnex inference engine — deterministic spectral tokenizer, multimodel weight balancing, and chunk streaming via the Madhava fast build. Model-agnostic (Qwen/BERT/DeepSeek/GPT), OpenCL, no CUDA."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Winnex Brasil Soluções Empresariais LTDA-ME", email = "pay@winnex.ai" },
]
keywords = [
    "inference", "llm", "spectral", "tokenizer", "quaternion", "multimodel",
    "weight-balancing", "streaming", "sse", "madhava", "deterministic",
    "opencl", "winnex", "deterministic",
]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "winnex-madhava>=1.8.1",   # the Madhava engine (fast build + bound kernels)
    "numpy>=1.20",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.20", "httpx>=0.27"]
bench = ["transformers>=4.40"]

[project.urls]
Homepage = "https://winnex.ai"
Source = "https://github.com/winnex-ai"
Zenodo = "https://zenodo.org/records/21861809"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.20"
wheel.packages = ["python/winnex_nano"]

# Versao a partir da tag git (setuptools-scm via scikit-build-core).
# `v0.1.23` -> `0.1.23`. Fora de uma tag, gera sufixo de desenvolvimento
# (ex.: 0.1.24.dev3+gabc1234) em vez de numero fixo — o PyPI recusa esses por
# padrao, o que e' o comportamento desejado: so se publica a partir de tag.
# A forma e' `metadata.<campo>` = "provider" (string). Uma tabela com
# `provider = ...` faz o provider receber settings e abortar com
# "No inline configuration is supported".
# sdist.include deve ficar em [tool.scikit-build], nao aqui — dentro desta
# tabela o TOML o trata como chave de metadata e o sdist sai incompleto.
sdist.include = [
    "include/**",
    "src/**",
    "bindings/**",
    "CMakeLists.txt",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "benchmark_honesto.py",
    "server_sse.py",
]

# Formato do scikit-build-core >= 1.0: uma lista de entradas com `provider`.
# O provider setuptools_scm rejeita QUALQUER chave extra ("No inline
# configuration is supported"), entao `provider` precisa ser a unica chave.
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build.cmake.define]
MADHAVA_BUILD_TESTS = "OFF"
MADHAVA_BUILD_BENCHMARK = "OFF"
MADHAVA_BUILD_EXAMPLES = "OFF"
WINNEX_NANO_BUILD_TESTS = "OFF"

[tool.cibuildwheel]
# Alvos explícitos: CPython 3.10–3.13. Sem esta seção o cibuildwheel usa o
# default dele, e o CI anterior sobrescrevia com CIBW_BUILD, publicando só
# cp312-manylinux_x86_64.
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
# testar cada wheel construído antes de publicar
test-command = "python -c \"import winnex_nano; print(winnex_nano.__version__)\""
# o pacote depende de winnex-madhava por wheel; instala para o teste
test-requires = "numpy"
build-verbosity = 1

[tool.cibuildwheel.linux]
# x86_64 apenas. aarch64 roda sob emulação QEMU no runner x86_64 e, com 4
# ABIs × compilação C++, estoura o tempo do job. Para publicar aarch64, use um
# runner nativo (ubuntu-24.04-arm) numa matriz separada.
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# macos-14 é arm64. Compilar x86_64 aqui funciona (cross-compile nativo da
# Apple), mas dobra o tempo; deixamos só arm64 e publicamos x86_64 via o
# runner macos-13 quando/se ele voltar.
archs = ["arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.setuptools]
package-dir = { "" = "python" }
