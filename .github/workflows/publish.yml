name: publish

# Publish winnex-nano to PyPI using a Trusted Publisher (OpenID Connect).
#
#   PyPI Project Name : winnex-nano
#   Owner             : winnex-ai
#   Repository name   : winnex-nano
#   Workflow name     : publish.yml
#   Environment name  : publish
#
# The wheel is built inside the official PyPA manylinux Docker image (broad
# manylinux tag), then PUBLISHED from the native runner — the OIDC Trusted
# Publisher cannot run inside the manylinux container (unsupported env).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write    # required for the trusted-publisher OIDC exchange

jobs:
  build:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist and wheel (manylinux container)
        run: |
          PY=/opt/python/cp312-cp312/bin/python
          $PY -m pip install --quiet build pybind11 cmake
          $PY -m build

      - name: Repair wheel to manylinux (auditwheel)
        run: |
          PY=/opt/python/cp312-cp312/bin/python
          $PY -m pip install --quiet auditwheel
          auditwheel repair dist/*.whl -w dist/repair --plat manylinux_2_28_x86_64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/repair/
